
name: Build Minecraft GTA V Passthrough

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Passthrough
        run: |
          chmod +x mc/gradlew
          ./mc/gradlew -p mc build

      - name: Upload Passthrough JAR
        uses: actions/upload-artifact@v4
        with:
          name: passthrough-0.1.0
          path: mc/build/libs/*.jar
          if-no-files-found: error





