

name: Build Minecraft 26.3 Fabric

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric Mod
        run: |
          chmod +x mc/gradlew
          ./mc/gradlew -p mc build

      - name: Upload Minecraft Mod
        uses: actions/upload-artifact@v4
        with:
          name: passthrough-minecraft-26.3
          path: mc/build/libs/*.jar
          if-no-files-found: error




